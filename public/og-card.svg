<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Laid Off Bench — Laid off because of AI? Take a seat.">
  <rect width="1200" height="630" fill="#f6f3ee" />
  <rect x="48" y="48" width="1104" height="534" rx="8" fill="none" stroke="#dfd8ce" stroke-width="2" />
  <!-- Minimal bench mark -->
  <g transform="translate(110, 115)">
    <rect x="0" y="0" width="56" height="6" rx="3" fill="#23201d" />
    <rect x="0" y="10" width="56" height="6" rx="3" fill="#23201d" />
    <rect x="-4" y="22" width="64" height="6" rx="3" fill="#9c4a2d" />
    <rect x="6" y="28" width="6" height="14" rx="2" fill="#23201d" />
    <rect x="44" y="28" width="6" height="14" rx="2" fill="#23201d" />
  </g>
  <text x="190" y="143" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="#23201d">Laid Off Bench</text>
  <text x="110" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#1c1917">Laid off because of AI?</text>
  <text x="110" y="370" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-style="italic" fill="#9c4a2d">Take a seat.</text>
  <text x="110" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#524c46">A human place for people whose roles have been eliminated, reduced, or</text>
  <text x="110" y="495" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" fill="#524c46">transformed by artificial intelligence—while figuring out what comes next.</text>
</svg>
